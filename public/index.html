<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrew Thorp — ~/</title>
    <meta name="description" content="Andrew Thorp — software engineer building things on the internet. Type a command to look around.">
    <meta name="color-scheme" content="dark">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>▮</text></svg>">
</head>
<body>
    <div class="window" role="application" aria-label="Interactive terminal">
        <div class="titlebar">
            <div class="lights" aria-hidden="true">
                <span class="light red"></span>
                <span class="light yellow"></span>
                <span class="light green"></span>
            </div>
            <div class="title">andrewthorp@ — ~</div>
            <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">◐</button>
        </div>

        <div class="screen" id="screen" tabindex="0">
            <div class="output" id="output"></div>

            <div class="prompt-line" id="prompt-line" hidden>
                <span class="prompt" aria-hidden="true"><span class="p-user">andrewthorp@</span><span class="p-sep">:</span><span class="p-path">~</span><span class="p-tip">$</span></span>
                <span class="input-wrap">
                    <input id="cmd" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Command input" />
                    <span class="fakecaret" id="fakecaret"></span>
                </span>
            </div>

            <div class="chips" id="chips" hidden aria-label="Suggested commands"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
